services:
  - type: web
    name: trademind-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: INITIAL_BALANCE
        value: "2000.0"
      - key: MAX_POSITION_SIZE_RATIO
        value: "0.20"
      - key: STOP_LOSS_PERCENT
        value: "0.015"
      - key: TAKE_PROFIT_PERCENT
        value: "0.035"
      - key: SCAN_INTERVAL_MINUTES
        value: "15"
      - key: DEFAULT_SYMBOLS
        value: "RELIANCE.NS,TCS.NS,INFY.NS,HDFCBANK.NS,ICICIBANK.NS,SBIN.NS,BHARTIARTL.NS,ITC.NS,LT.NS,M&M.NS,MARUTI.NS,KOTAKBANK.NS,AXISBANK.NS,BAJFINANCE.NS,ASIANPAINT.NS,WIPRO.NS,^NSEI,^NSEBANK"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false

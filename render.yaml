services:
  - type: web
    name: trademind-ai-nifty-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TELEGRAM_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: INITIAL_BALANCE
        value: "30000.0"
      - key: MAX_DAILY_LOSS
        value: "2000.0"
      - key: MAX_DAILY_PROFIT
        value: "4000.0"

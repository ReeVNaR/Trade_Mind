services:
  - type: web
    name: trademind-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: INITIAL_BALANCE
        value: "30000.0"
      - key: MAX_POSITION_SIZE_RATIO
        value: "0.35"
      - key: STOP_LOSS_PERCENT
        value: "0.015"
      - key: TAKE_PROFIT_PERCENT
        value: "0.035"
      - key: MAX_DAILY_TRADES
        value: "4"
      - key: MAX_DAILY_LOSS
        value: "2000.0"
      - key: MAX_DAILY_PROFIT
        value: "4000.0"
      - key: NIFTY_LOT_SIZE
        value: "65"
      - key: NIFTY_STRIKE_STEP
        value: "50"
      - key: OPTION_STRIKE_TYPE
        value: "ITM"
      - key: SCAN_INTERVAL_MINUTES
        value: "15"
      - key: DEFAULT_SYMBOLS
        value: "^NSEI"
      - key: AUTO_RESET_DB_ON_START
        value: "true"
      - key: AUTO_EOD_SQUARE_OFF
        value: "true"
      - key: EOD_SQUARE_OFF_TIME
        value: "15:25"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
